org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Gradle 的默认 HTTP socket 超时是 30 秒。kotlin-compiler-embeddable 有 58 MB，
# 在慢链路上必然超时，而且失败信息会指向最后一个尝试的仓库（Kotlin 插件自己的
# GitHub release，那儿通常是连不上的），看起来像"仓库不可达"，实际是超时。
# 这个静默误导很容易让人白折腾半小时。
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=600000

kotlin.code.style=official
